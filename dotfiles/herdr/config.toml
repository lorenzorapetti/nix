onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[keys]
copy_mode = "prefix+enter"
new_tab = "prefix+t"
settings = "prefix+comma"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
goto = "prefix+/"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = 'cd "$(herdr-worktree-current)" 2>/dev/null; exec lazygit'
width = "90%"
height = "90%"
description = "Git: lazygit on the current worktree"

[[keys.command]]
key = "prefix+space"
type = "popup"
# Through fish so the secrets in secrets.fish (LINEAR_*) are current, rather
# than whatever environment the herdr server inherited when it started.
command = "fish -c herdr-linear"
width = "90%"
height = "90%"
description = "Create a new worktree from linear"

[[keys.command]]
key = "prefix+o"
type = "popup"
command = "gh dash"
width = "90%"
height = "90%"
description = "GitHub: dashboard"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "herdr-bar.open"
description = "Command bar"

[[keys.command]]
key = "prefix+tab"
type = "plugin_action"
command = "third774.last-workspace.toggle"
description = "last workspace"

[ui]
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[experimental]
kitty_graphics = true

[update]
version_check = false
